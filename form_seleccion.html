<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario con Selección</title>
</head>
<body>
    <h2>Formularios con seleccion</h2>
    <form action="" method="post">
        Ingresa tu nombre:
        <input type="text" name="nombre">
        <br>
        Selecciona tu pais:
        <select name="pais"> <!--Define la lista desplegable | <option value="...">: Define cada una de las opciones seleccionables | value: Es el valor que se envía a la base de datos, si el usuario elige "México", se enviará el número "3" | texto sin comillas: es lo que el usuario ve en pantalla al abrir el menú-->
            <option value="1">Argentina</option>
            <option value="2">España</option>
            <option value="3">Mexico</option>
            <option value="4">Guatemala</option>
            <option value="5">Honduras</option>
            <option value="6">El Salvador</option>
            <option value="7">Venezuela</option>
            <option value="8">Colombia</option>
        </select>
        <br>
        <input type="submit" value="enviar">
        <input type="reset" value="borrar">
    </form>
</body>
</html>
