<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario con Botones</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css"> <!--Link para los iconos-->
</head>
<body>
    <h2>Formulario con botones</h2>
    <form action="" method="post">
        Ingresa tu nombre:
        <input type="text" name="nombre">
        <br>
        <button type="submit">Enviar <i class="fa-regular fa-paper-plane"></i></button> <!--Se utiliza universalmente para representar la acción de enviar-->
        <button type="reset">Borrar <i class="fa fa-trash"></i></button> <!--Se utiliza para indicar la acción de eliminar, borrar o descartar un elemento-->
    </form>
</body>
</html>
