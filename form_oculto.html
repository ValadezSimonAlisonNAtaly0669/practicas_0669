<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario con Campos Ocultos</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css">
</head>
<body>
    <h2>Formulario con campos ocultos</h2>
    <form action="" method="post">
        <input type="hidden" name="hora" value="3:30"><!--type="hidden": Le indica al navegador que oculte este campo visualmente. | value="3:30": valor predefinido que se enviará automáticamente-->
        Ingresa tu nombre:
        <input type="text" name="nombre">
        <br>
        <button type="submit">Enviar <i class="fa-regular fa-paper-plane"></i></button>
        <button type="reset">Borrar <i class="fa fa-trash"></i></button>
    </form>
</body>
</html>
