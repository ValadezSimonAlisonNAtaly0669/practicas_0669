<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario con Textarea</title>
</head>
<body>
    <h2>Formulario con text area</h2>
    <form action="" method="post">c
        Ingresa tu nombre:
        <input type="text" name="nombre"> <!--Input: Permite ingresar datos, interactuar,... | Type: Tipo de dato, en este caso texto | Name: Lo que vera el usuario, lo que le indica-->
        <br>
        Ingresa tu correo:
        <input type="email" name="correo"><!--Input: Permite ingresar datos, interactuar,... | Type: Tipo de dato, en este caso correo electronico. | Name: Lo que vera el usuario, lo que le indica-->
        <br>
        Ingresa tus comentarios:
        <textarea name="comentarios" rows="1" cols="10"></textarea> <!--Textarea: permite ingresar textos grandes, a diferencia del input que solo permite una linea | name: Lo que vera el usuario, lo que le indica | rows, cols: altura y ancho del cuadro de texto-->
        <br>
        <input type="submit" value="enviar"> <!--Input: Permite ingresar datos, interactuar,... | Type: Tipo de dato, en este caso Subir, o sea enviar | value: Lo que vera el usuario, lo que le indica-->
        <input type="reset" value="borrar"> <!--Input: Permite ingresar datos, interactuar,... | Type: Tipo de dato, en este caso reset, para que al enviar los datos, se borren del contenedor de texto y puedas ingresar nuevos | value: Lo que vera el usuario, lo que le indica-->
    </form>
</body>
</html>
