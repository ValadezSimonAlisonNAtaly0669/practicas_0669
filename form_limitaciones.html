<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario con Limitaciones</title>
</head>
<body>
    <h2>Formulario con limitaciones</h2>
    <form action="" method="post">
        Ingresa tu nombre:
        <!-- Deshabilitacion de campo|El usuario no puede hacer clic en él ni escribir nada. Se muestra grisáceo. -->
        <input type="text" name="nombre" disabled><br>
        <!-- Limitacion de caracteres| solo permite escribir un máximo de 5 caracteres. -->
        Contraseña:
        <input type="password" name="pass" maxlength="5"><br>
        <!-- Solo lectura | Muestra un área de texto con un mensaje precargado. El usuario puede seleccionar el texto y copiarlo, pero no puede editarlo ni borrarlo. -->
        Comentarios:
        <textarea name="comentarios" readonly>Este es mi comentario y no se puede borrar</textarea><br>
    </form>
</body>
</html>
