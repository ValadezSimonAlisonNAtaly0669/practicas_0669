<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario con Checkbox</title>
</head>
<body>
    <h2>Formularios con checkbox</h2>
    <form action="" method="post"><!--Form: crea un contenedor para recolectar los datos del usuario | action. Hacia donde se van a enviar los datos, como esta vacio, se enviaran a la misma pagina del formulario | method: Hace que los datos viajen seguros-->
        Ingresa tu nombre:
        <input type="text" name="nombre"> <!--Input: Permite ingresar datos, interactuar,... | Type: Tipo de dato, en este caso texto | Name: Lo que vera el usuario, lo que le indica-->
        <br>
        Selecciona los lenguajes que conozcas:
        <br>
        <input type="checkbox" name="Java">Java <br> <!--Input: etiqueta para interactuar | type: Tipo de dato, en este caso chechbox, que son cuadros o casillas para marcar | name: nombre para marcar, y que se enviara | java: dato nombre juto a la casilla que ve ek usuario-->
        <input type="checkbox" name="Python"> Python <br>
        <input type="checkbox" name="C#">C# <br>
        <input type="checkbox" name="Flutter"> Flutter <br>
    </form>
</body>
</html>
