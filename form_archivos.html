<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario con Archivos</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css"><!--Link para los iconos-->
</head>
<body>
    <h2>Formulario con archivos</h2>
    <form action="" method="post">
        Ingresa tu nombre:
        <input type="text" name="nombre">
        <br>
        <input type="file" name="archivo"> <!--sirve para agregar un botón de selección de archivos en un formulario web, permitiendo que el usuario suba documentos o imágenes desde su dispositivo-->
        <br>
        <button type="submit">Enviar <i class="fa-regular fa-paper-plane"></i></button>
        <button type="reset">Borrar <i class="fa fa-trash"></i></button>
    </form>
</body>
</html>
