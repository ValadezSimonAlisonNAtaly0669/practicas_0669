<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario para Contraseñas</title>
</head>
<body>
    <h2>Formulario para contraseñas</h2>
    <form action="" method="post"> <!--Form: Contenedor para los datos y botones | Action: Define la direccion a la que se enviaran los datos, como esta vacio, se enviaran a la misma pagina | method: Es la maera en que se envian los datos, en este caso oculta por donde navegan los datos-->
        Ingresa tu usuario:
        <input type="text" name="usuario"> <!--Input: Permite ingresar datos, interactuar,... | Type: Tipo de dato, en este caso texto | Name: Lo que vera el usuario, loo que le indica--> 
        Ingresa tu contraseña:
        <input type="password" name="pass"> <!--Input: Permite ingresar datos, interactuar,... | Type: Tipo de dato, en este caso contraseña. Lo que a au vez cambia los caracteres por '*'' para mas seguridad | Name: Lo que vera el usuario, lo que le indica--> 
        <br>
        <input type="submit" value="enviar"><!--Input: Permite ingresar datos, interactuar,... | Type: Tipo de dato, en este caso Subir, o sea enviar | value: Lo que vera el usuario, lo que le indica-->
        <input type="reset" value="borrar"><!--Input: Permite ingresar datos, interactuar,... | Type: Tipo de dato, en este caso reset, para que al enviar los datos, se borren del contenedor de texto y puedas ingresar nuevos | value: Lo que vera el usuario, lo que le indica-->
    </form>
</body>
</html>
